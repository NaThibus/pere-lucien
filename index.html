<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison Lelégard — Le Père Lucien &amp; Mère Martine | French Slow Grooming &amp; Botanical Care</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/logo-perelucien.png">
</head>
<body class="split-body">

  <!-- En-tête Quiet Luxury d'époque -->
  <header class="split-top-bar">
    <div class="split-brand-legend">Maison Lelégard • France</div>
    <div style="display:flex;align-items:center;gap:12px;pointer-events:auto;">
      <button class="currency-selector currency-toggle-btn" onclick="toggleCurrency()">€ EUR</button>
      <div class="split-tag-label">Micro-Lot Saponification &amp; Pure Botanicals</div>
    </div>
  </header>

  <!-- Sélecteur Double Face Épuré & Authentique -->
  <main class="split-container">
    
    <!-- Volet Gauche : Le Père Lucien -->
    <a href="pere-lucien.html" class="split-panel panel-lucien" aria-label="Découvrir Le Père Lucien">
      <div class="split-panel-bg" style="background-image: url('assets/perelucien_split_bg.jpg');"></div>
      <div class="split-panel-overlay"></div>
      
      <div class="split-content">
        <!-- Médaillon du fondateur -->
        <div class="split-portrait-frame">
          <img src="assets/logo-perelucien.png" alt="Le Père Lucien" class="split-portrait-img">
        </div>
        <h1 class="split-brand-title">Le Père Lucien</h1>
        <div class="split-brand-subtitle">Savonnerie Artisanale Bourbonnaise • Teillet-Argenty (Allier)</div>
        <div class="split-brand-line"></div>
        <span class="split-brand-cta">Entrer dans l'Atelier</span>
      </div>
    </a>

    <!-- Séparateur vertical fin avec repère minimaliste -->
    <div class="split-divider">
      <span class="divider-dot"></span>
    </div>

    <!-- Volet Droit : Mère Martine -->
    <a href="mere-martine.html" class="split-panel panel-martine" aria-label="Découvrir Mère Martine">
      <div class="split-panel-bg" style="background-image: url('assets/meremartine_split_bg.jpg');"></div>
      <div class="split-panel-overlay"></div>
      
      <div class="split-content">
        <!-- Médaillon de la fondatrice -->
        <div class="split-portrait-frame">
          <img src="assets/mere_martine_portrait.jpg" alt="Mère Martine" class="split-portrait-img">
        </div>
        <h1 class="split-brand-title">Mère Martine</h1>
        <div class="split-brand-subtitle">Salon Botanique &amp; Soins au Féminin • Inspiré 1968</div>
        <div class="split-brand-line"></div>
        <span class="split-brand-cta">Entrer dans le Salon</span>
      </div>
    </a>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
